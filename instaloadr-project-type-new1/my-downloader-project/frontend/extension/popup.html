<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InstaLoadr</title>
<style>
  body{ width: 300px; margin:0; font-family: Inter, system-ui, sans-serif; background:#14171C; color:#fff; }
  .pad{ padding: 14px; }
  h1{ font-size: 15px; margin: 0 0 10px; }
  #url{ font-size: 11px; color:#8A8F98; word-break: break-all; margin-bottom: 10px; font-family: monospace; }
  button{ width:100%; padding:10px; border:none; border-radius:6px; background:#FF3B7F; color:#fff; font-weight:700; cursor:pointer; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  #status{ margin-top:10px; font-size:12px; color:#8A8F98; }
  .frame-list{ margin-top:10px; display:flex; flex-direction:column; gap:6px; max-height:220px; overflow:auto; }
  .frame-list a{ color:#1FA6A0; font-size:12px; text-decoration:none; }
</style>
</head>
<body>
  <div class="pad">
    <h1>InstaLoadr</h1>
    <div id="url">Detecting current tab…</div>
    <button id="fetchBtn" disabled>Not an Instagram link</button>
    <div id="status"></div>
    <div id="results" class="frame-list"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
